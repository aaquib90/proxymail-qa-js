# Publishes to npm when a GitHub release is published (tag v<version>), with
# npm trusted publishing: GitHub's OIDC token proves the workflow to npm, so
# no npm token is stored anywhere, and npm adds provenance (which commit and
# workflow built the version) automatically.
#
# One-time setup on npmjs.com: proxymail-qa → Settings → Trusted publishing →
# GitHub Actions, owner aaquib90, repository proxymail-qa-js, workflow
# publish.yml, environment npm.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Check the release tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      # prepublishOnly builds and tests first.
      - run: npm publish
